<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>English journey</title>
  <meta name="description" content="行きたい国の観光地やニュースを通して、英語を学べるアプリ">
  <meta name="theme-color" content="#14233a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2314233a%27/%3E%3Ccircle cx=%2716%27 cy=%2717%27 r=%279%27 fill=%27%232f7d7b%27/%3E%3Cpath d=%27M6 24L26 8l-6 18-4-7z%27 fill=%27%23e2703a%27/%3E%3C/svg%3E">

  <!-- フォント：画面の文字は M PLUS Rounded 1c（丸ゴシック）、ロゴは Fredoka、英文の記事は Newsreader -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400&display=swap" rel="stylesheet">
  <!-- 地図（Leaflet）。地図の画面で使う -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- CSS は役割ごとに分けてある。後ろのものが前のものを上書きできる順番に並べる -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/guide.css">
  <link rel="stylesheet" href="css/scenes.css">
  <link rel="stylesheet" href="css/scene-world.css">
  <link rel="stylesheet" href="css/scene-study.css">
  <link rel="stylesheet" href="css/scene-me.css">
</head>
<body>
  <!-- 全画面共通のヘッダー。画面が切り替わっても、ここは変わらない（中身は AppShell.js が描く） -->
  <header class="app-header">
    <div class="app-header__inner">
      <a class="logo" href="#/" aria-label="English journey ホーム">English <em>journey</em></a>
      <nav class="app-nav" id="nav" aria-label="メイン"></nav>
      <div class="app-header__right">
        <div class="hud" id="hud"></div>
        <div class="sound-toggles" id="sound-toggles"></div>
      </div>
    </div>
  </header>

  <!-- 画面（Scene）の中身はこの中に描画する -->
  <main id="app" class="app-main"></main>

  <!-- スマホ用の、画面下のタブバー（中身は AppShell.js が描く） -->
  <nav class="tabbar" id="tabbar" aria-label="メイン（スマホ）"></nav>

  <!-- 案内キャラクター。Guide.js が中身を作り、画面に合わせて置き場所を移す -->
  <div id="guide" class="guide guide--corner" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

  <!-- 地図（Leaflet）。グローバル変数 L として、地図の画面で使う -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- type="module" にすると import / export が使える（C# の using に近い） -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
